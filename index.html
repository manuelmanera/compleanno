
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foto della festa</title>
<style>
:root {
  --ink:#33291f;
  --paper:#f7f0df;
  --line:#d7c8a9;
  --accent:#795b36;
  --muted:#766957;
}
* { box-sizing:border-box }
body {
  margin:0;
  padding:18px 10px;
  background:#252321;
  color:var(--ink);
  font-family:Georgia,serif;
}
main {
  max-width:980px;
  margin:auto;
  background:var(--paper);
  padding:clamp(16px,4vw,34px);
  border:1px solid var(--line);
}
header {
  text-align:center;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
h1 { font-size:clamp(30px,5vw,44px); margin:8px 0 }
h2 { margin:0 0 14px; font-size:23px }
.panel {
  margin:18px 0;
  padding:16px;
  background:#fffaf0;
  border:1px dashed var(--line);
}
.muted,.status {
  color:var(--muted);
  font:14px Arial,sans-serif;
  line-height:1.5;
}
button {
  background:var(--accent);
  color:white;
  border:0;
  padding:12px 16px;
  font:bold 13px Arial,sans-serif;
  cursor:pointer;
}
button:disabled { opacity:.55 }
input,select {
  font:inherit;
  padding:11px;
  border:1px solid var(--line);
  background:#fffdf7;
  color:var(--ink);
  width:100%;
  margin:6px 0 12px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.album,.photo {
  min-width:0;
  background:#fffaf0;
  border:1px solid var(--line);
  padding:8px;
  cursor:pointer;
  text-align:left;
  color:var(--ink);
}
.album img,.photo img {
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#e8dfc8;
}
.album strong {
  display:block;
  padding:8px 2px 2px;
  overflow-wrap:anywhere;
}
.caption {
  text-align:center;
  padding:8px 2px;
  overflow-wrap:anywhere;
}
.empty {
  text-align:center;
  color:var(--muted);
  padding:20px;
}
.hidden { display:none!important }
.status { margin-top:10px }
@media(max-width:600px) {
  body { padding:6px }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
  main { padding:14px 10px }
}
</style>
</head>
<body>
<main>
<header>
  <div class="muted">ALBUM CONDIVISO</div>
  <h1>Foto della festa</h1>
</header>

<section class="panel">
  <h2>Wi-Fi</h2>
  <p>
    Rete: <strong>vodafone-compleanno</strong><br>
    Password: <strong>Compleanno</strong>
  </p>
  <button id="wifi">Connettiti al Wi-Fi</button>
  <p id="wifiStatus" class="status">
    Premi il pulsante per visualizzare le istruzioni di connessione.
  </p>
</section>

<section class="panel">
  <h2>Carica foto</h2>
  <label for="pin">Password per caricare</label>
  <input id="pin" type="password" inputmode="numeric"
         placeholder="Password condivisa">
  <button id="login">Accedi</button>

  <div id="uploadPanel" class="hidden">
    <label for="albumSelect">Album</label>
    <select id="albumSelect"></select>

    <label for="caption">Didascalia (facoltativa)</label>
    <input id="caption" type="text" maxlength="100"
           placeholder="Didascalia">

    <label for="files">Seleziona le foto</label>
    <input id="files" type="file" accept="image/*" multiple>

    <button id="upload">Carica foto</button>
    <div id="uploadStatus" class="status"></div>
  </div>
</section>

<section>
  <h2>Album</h2>
  <div id="albums" class="grid">
    <p class="empty">Caricamento album…</p>
  </div>

  <div id="albumView" class="hidden">
    <button id="back" style="margin:14px 0">
      ← Tutti gli album
    </button>
    <h2 id="albumTitle"></h2>
    <div id="photos" class="grid"></div>
  </div>
</section>
</main>

<script type="module">
import {initializeApp}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, push, onValue, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwg3lPCXsjjdPOuxLzsZ8J_JuZ37JSv5w",
  authDomain: "ruotadellafortuna-28f02.firebaseapp.com",
  databaseURL: "https://ruotadellafortuna-28f02-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ruotadellafortuna-28f02",
  storageBucket: "ruotadellafortuna-28f02.firebasestorage.app",
  messagingSenderId: "346375806708",
  appId: "1:346375806708:web:fee4f15879e1dbfb2788a1"
};

// Chiave API ImgBB e password di caricamento
const IMGBB_KEY = "da4638b1c608970bd645b428cc849915";
const UPLOAD_PASSWORD = "1234";

const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

let albums = {};
let photos = {};
let selected = null;
let logged = false;

const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};

// Il browser non può connettere automaticamente il dispositivo
// a una rete Wi-Fi.
$("wifi").onclick = async () => {
  try {
    if (navigator.clipboard && isSecureContext) {
      await navigator.clipboard.writeText(
        "Wi-Fi: vodafone-compleanno\nPassword: Compleanno"
      );
    }
  } catch (e) {}

  $("wifiStatus").textContent =
    "Apri le impostazioni Wi-Fi del dispositivo, scegli " +
    "vodafone-compleanno e inserisci la password Compleanno.";
};

function albumList() {
  return Object.entries(albums)
    .map(([id, a]) => ({id, ...a}))
    .sort((a, b) =>
      (a.nome || "").localeCompare(b.nome || "", "it")
    );
}

function photoList() {
  return Object.values(photos).filter(p => p && p.url);
}

function render() {
  const list = albumList();
  const ps = photoList();
  const sel = $("albumSelect");
  const old = sel.value;

  sel.replaceChildren();

  for (const a of list) {
    const o = el("option", "", a.nome || "Album");
    o.value = a.id;
    sel.append(o);
  }

  if (list.some(a => a.id === old)) sel.value = old;

  const box = $("albums");
  box.replaceChildren();

  if (!list.length) {
    box.append(el("p", "empty", "Nessun album ancora disponibile."));
  }

  for (const a of list) {
    const items = ps.filter(p => p.albumId === a.id);
    const b = el("button", "album");
    b.type = "button";

    if (items[0]?.url) {
      const im = el("img");
      im.src = items[0].url;
      im.alt = "";
      im.loading = "lazy";
      b.append(im);
    } else {
      b.append(el("div", "empty", "Album"));
    }

    b.append(el(
      "strong", "",
      `${a.nome || "Album"} · ${items.length} foto`
    ));

    b.onclick = () => openAlbum(a.id);
    box.append(b);
  }

  if (selected) openAlbum(selected);
}

function openAlbum(id) {
  const a = albumList().find(x => x.id === id);
  if (!a) return;

  selected = id;
  $("albumView").classList.remove("hidden");
  $("albumTitle").textContent = a.nome || "Album";

  const box = $("photos");
  box.replaceChildren();

  const list = photoList()
    .filter(p => p.albumId === id)
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  if (!list.length) {
    box.append(el("p", "empty", "Nessuna foto in questo album."));
  }

  for (const p of list) {
    const c = el("article", "photo");
    const im = el("img");

    im.src = p.url;
    im.alt = p.nome || "Foto";
    im.loading = "lazy";
    c.append(im);

    if (p.nome) c.append(el("div", "caption", p.nome));
    box.append(c);
  }
}

$("back").onclick = () => {
  selected = null;
  $("albumView").classList.add("hidden");
};

$("login").onclick = () => {
  if ($("pin").value !== UPLOAD_PASSWORD) {
    $("uploadStatus").textContent = "Password non corretta.";
    return;
  }

  logged = true;
  $("uploadPanel").classList.remove("hidden");
  $("pin").disabled = true;
  $("login").disabled = true;
};

// Sincronizzazione con gli album e le foto già presenti in Firebase
onValue(ref(db, "album"), s => {
  albums = s.val() || {};
  render();
});

onValue(query(ref(db, "foto"), limitToLast(500)), s => {
  photos = s.val() || {};
  render();
});

// Caricamento foto su ImgBB e registrazione su Firebase
$("upload").onclick = async () => {
  if (!logged) return;

  const albumId = $("albumSelect").value;
  const files = [...($("files").files || [])];

  if (!albumId) {
    $("uploadStatus").textContent = "Non ci sono album disponibili.";
    return;
  }

  if (!files.length) {
    $("uploadStatus").textContent = "Seleziona almeno una foto.";
    return;
  }

  if (files.some(f =>
      !f.type.startsWith("image/") ||
      f.size > 10 * 1024 * 1024)) {
    $("uploadStatus").textContent =
      "Solo immagini fino a 10 MB ciascuna.";
    return;
  }

  $("upload").disabled = true;
  let ok = 0;
  const caption = $("caption").value.trim();

  try {
    for (let i = 0; i < files.length; i++) {
      $("uploadStatus").textContent =
        `Caricamento ${i + 1}/${files.length}…`;

      const fd = new FormData();
      fd.append("image", files[i]);

      const r = await fetch(
        `https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,
        {method: "POST", body: fd}
      );

      const j = await r.json();

      if (!r.ok || !j.success || !j.data?.url) {
        throw new Error("Upload ImgBB non riuscito");
      }

      await push(ref(db, "foto"), {
        url: j.data.url,
        nome: caption,
        albumId,
        createdAt: Date.now()
      });

      ok++;
    }

    $("files").value = "";
    $("caption").value = "";
    $("uploadStatus").textContent = `Caricate ${ok} foto.`;

  } catch (e) {
    $("uploadStatus").textContent =
      "Errore nel caricamento. Controlla le regole Firebase e la chiave ImgBB.";
    console.error(e);

  } finally {
    $("upload").disabled = false;
  }
};
</script>
</body>
</html>
